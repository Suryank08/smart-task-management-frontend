<mat-sidenav-container class="shell">
  <mat-sidenav class="shell__sidenav" [mode]="sidenavMode()" [opened]="sidenavOpened()" [fixedInViewport]="true"
    fixedTopGap="0">
    <div class="shell__brand">
      <span class="shell__brand-icon">
        <mat-icon aria-hidden="true">task_alt</mat-icon>
      </span>
      <span>Do IT</span>
    </div>
    <mat-nav-list class="shell__nav">
      @for (item of navItems; track item.route) {
      <a mat-list-item class="shell__nav-item" [routerLink]="item.route" routerLinkActive="shell__nav-active"
        (click)="sidenavMode() === 'over' && toggleSidenav()">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell__toolbar">
      <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>

      @if (!sidenavOpened()) {
      <div class="shell__toolbar-brand">
        <span class="shell__brand-icon">
          <mat-icon aria-hidden="true">task_alt</mat-icon>
        </span>
        <span>Do IT</span>
      </div>
      }

      <span class="shell__spacer"></span>

      <button mat-icon-button [matTooltip]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="theme.toggle()" aria-label="Toggle theme">
        <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
        <div class="shell__avatar">{{ userInitials() }}</div>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="shell__menu-header">
          <div class="shell__menu-name">{{ auth.currentUser()?.name }}</div>
          <div class="shell__menu-email">{{ auth.currentUser()?.email }}</div>
        </div>
        <mat-divider />
        <a mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </a>
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
