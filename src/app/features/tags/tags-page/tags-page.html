<div class="tags-page">
  <header class="page-header">
    <div>
      <h1 class="page-header__title">Tags</h1>
      <p class="page-header__subtitle">Fine-grained labels you can attach to any task.</p>
    </div>
    <button mat-flat-button color="primary" class="page-header__action" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      New tag
    </button>
  </header>

  @if (tagService.loading()) {
    <div class="tags-page__loading">
      <mat-progress-spinner diameter="36" mode="indeterminate" />
    </div>
  } @else if (tagService.tags().length === 0) {
    <div class="tags-page__empty">
      <mat-icon>sell</mat-icon>
      <p>No tags yet.</p>
      <button mat-stroked-button (click)="openCreateDialog()">Create your first tag</button>
    </div>
  } @else {
    <mat-card class="tags-page__card">
      <mat-chip-set>
        @for (tag of tagService.tags(); track tag.id) {
          <mat-chip
            [style.background]="tag.color ?? '#00696d'"
            [style.color]="getContrastTextColor(tag.color)"
            [style.--mat-chip-with-trailing-icon-trailing-icon-color]="getContrastTextColor(tag.color)"
            (click)="openEditDialog(tag)"
            (removed)="deleteTag(tag)"
          >
            {{ tag.name }}
            @if (tagTaskCounts().get(tag.id); as count) {
              <span class="tags-page__chip-count">{{ count }}</span>
            }
            <button matChipRemove [attr.aria-label]="'Delete ' + tag.name">
              <mat-icon>cancel</mat-icon>
            </button>
          </mat-chip>
        }
      </mat-chip-set>
    </mat-card>
  }
</div>
